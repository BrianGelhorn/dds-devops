name: CI - Docker, GHCR y Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Construir imagen
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        run: |
          trap 'docker rm -f web-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name web-test -p 127.0.0.1:8080:80 dds-devops-demo:test
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar en ambos registros
        if: github.ref == 'refs/heads/main'
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USERNAME,,}/dds-devops-demo"
          COMMIT_TAG="${GITHUB_SHA::7}"

          for IMAGE in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker tag dds-devops-demo:test "${IMAGE}:latest"
            docker tag dds-devops-demo:test "${IMAGE}:${COMMIT_TAG}"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:${COMMIT_TAG}"
          done
